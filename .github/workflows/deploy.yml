name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Needed to force push the built site to the gh-pages branch
permissions:
  contents: write

# Never let two deploys race on the same force-pushed branch
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # --immutable fails the build rather than quietly rewriting the lockfile
      - run: yarn install --immutable

      # A broken component must not reach the kiosk. The smoke test mounts
      # every component and fails on anything Vue reports while doing so.
      - run: yarn lint
      - run: yarn test

      # .env.production is committed, so this needs no secrets
      - run: yarn build

      - name: Publish to gh-pages
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "deploy: ${GITHUB_SHA::7}"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages:gh-pages
